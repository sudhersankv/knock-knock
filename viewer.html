<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COLOR RIOT · Crew Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #170b26; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) rotate(-1.5deg); display: flex; gap: 8px; }
      #bar button { font: 15px 'Bungee', sans-serif; padding: 8px 14px; border: 3px solid #170b26; background: #ffe11a; color: #170b26; box-shadow: 4px 4px 0 #170b26; cursor: pointer; }
      #bar button.on { background: #ff2e88; color: #fff; }
      #title { position: fixed; top: 16px; left: 20px; font: 34px 'Bungee', sans-serif; color: #ffe11a; text-shadow: 3px 3px 0 #ff2e88, 6px 6px 0 #170b26; transform: rotate(-3deg); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="title">THE CREW</div>
    <div id="bar"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
